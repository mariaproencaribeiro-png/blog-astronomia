<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página sobre o espaço</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="card">
        <img src="Gemini_Generated_Image_6gpyl66gpyl66gpy.png" alt="Praia paradisíaca" class="card-image">
        
        <div class="card-content">
            <span class="tag">Viagem</span>
            <h2>Explore o Mundo</h2>
            <p>Descubra destinos inacreditáveis, viva novas aventuras e colecione memórias inesquecíveis pelo planeta.</p>
            
            <button class="like-button" onclick="toggleLike()">
                <i class="fa-regular fa-heart" id="heart-icon"></i> Curtir
            </button>
        </div>
    </div>

    <script>
        function toggleLike() {
            const button = document.querySelector('.like-button');
            const icon = document.getElementById('heart-icon');
            
            button.classList.toggle('liked');
            
            if (button.classList.contains('liked')) {
                icon.className = "fa-solid fa-heart";
            } else {
                icon.className = "fa-regular fa-heart";
            }
        }
    </script>
</body>
</html>
